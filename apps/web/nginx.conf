server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Single-page app: any unmatched path is the client's router to resolve, not
  # a 404 — otherwise a refresh on /crm/pipeline would fail.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The client fetches a relative /api, so it is proxied here rather than
  # published on its own origin. No CORS, no build-time API URL, and the
  # browser only ever needs one port open.
  location /api/ {
    proxy_pass         http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /health {
    proxy_pass http://api:4000/health;
  }

  # Hashed filenames, so they can be cached hard; index.html must not be.
  location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}

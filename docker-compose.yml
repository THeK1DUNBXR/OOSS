# The whole platform, in Docker.
#
#   docker compose up --build          everything: database, API, web
#   docker compose up -d postgres      just the database, when you are running
#                                      the API and web on the host via dev.sh
#
# The web container serves the built client and proxies /api to the API
# container, so http://localhost:8080 is the only address you need.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kaizen-postgres
    environment:
      POSTGRES_USER: kaizen
      POSTGRES_PASSWORD: kaizen
      POSTGRES_DB: kaizen
    ports:
      # Published so host-side tooling — psql, Prisma Studio, the test suite —
      # can reach it too.
      - "5432:5432"
    volumes:
      - kaizen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizen -d kaizen"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BUILD_SEQUENCE: "1"
        GIT_SHA: docker-local
        BUILT_AT: "2026-09-20T00:00:00Z"
    container_name: kaizen-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # `postgres` is the compose service name; inside the network it resolves
      # to the database container, not to localhost.
      DATABASE_URL: postgresql://kaizen:kaizen@postgres:5432/kaizen?schema=public
      BUILD_SEQUENCE: "1"
      GIT_SHA: docker-local
      BUILT_AT: "2026-09-20T00:00:00Z"
      # Development only. A real deployment injects a secret rather than
      # carrying one in a file that lives in the repository.
      JWT_SECRET: kaizen-local-dev-secret-2026-do-not-use-in-prod
      # The first account, so `docker compose up` gives you credentials you can
      # actually type. Without these the seed generates a random password and
      # prints it once into this container's log — correct for a real install,
      # and no way to run a local stack.
      #
      # Development only, for the same reason as the secret above.
      OWNER_EMAIL: chairman@kaizen.co.in
      OWNER_PASSWORD: kaizen2026
      PORT: "4000"
      NODE_ENV: development
      JOBS_ENABLED: "true"
      TENANT_ENFORCE_MODE: enforce
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BUILD_SEQUENCE: "1"
        GIT_SHA: docker-local
        BUILT_AT: "2026-09-20T00:00:00Z"
    container_name: kaizen-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

  test:
    image: node:22-slim
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://kaizen:kaizen@postgres:5432/kaizen_test?schema=public
      NODE_ENV: test
      JWT_SECRET: test-only-secret-not-used-anywhere-else-0123456789
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: ["sh", "-c", "corepack enable; pnpm install --frozen-lockfile; pnpm --filter @kaizen/shared build; pnpm --filter @kaizen/semantic build; pnpm --filter @kaizen/api exec prisma generate; pnpm --filter @kaizen/api test:quick"]
    profiles:
      - test

volumes:
  kaizen-pgdata:

# The full ledger and concurrency proof (CI-GATES-DRAFT section 2 and section 5, question 8).
#
# Manual only. The per-PR runs are the L1 property test at its default size (1000 operations,
# inside the serial API suite in ci.yml) and the concurrency suite at L3_CONCURRENCY=50 (ci.yml).
# This is the phase-end run: 10,000 operations for L1, and 200 concurrent allocations for L3,
# repeated over 20 seeds. The L3 latency ceiling is the owner decision of 2026-10-12 (question 8).
#
# The database setup mirrors the api tests job in ci.yml, so the two cannot drift silently.

name: Proof (full)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BUILD_SEQUENCE: ${{ github.run_number }}
  GIT_SHA: ${{ github.sha }}

jobs:
  proof:
    name: ledger and concurrency, full size
    runs-on: ubuntu-latest
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaizen
          POSTGRES_PASSWORD: kaizen
          POSTGRES_DB: kaizen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://kaizen_app:kaizen_app@127.0.0.1:5432/kaizen_test?schema=public
      MIGRATION_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      UNSCOPED_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      TEST_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      # Full sizes. Owner decisions, CI-GATES-DRAFT section 5, question 8.
      L1_OPS: 10000
      L3_CONCURRENCY: 200
      L3_RUNS: 20
      L3_P95_CEILING_MS: 2000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kaizen/shared build
      - run: pnpm --filter @kaizen/semantic build
      - run: pnpm --filter @kaizen/api exec prisma generate
      - name: Application role and migrations
        env:
          PGPASSWORD: kaizen
        run: psql -h 127.0.0.1 -U kaizen -d kaizen_test -v ON_ERROR_STOP=1 -f scripts/app-role.sql
      - run: pnpm --filter @kaizen/api db:deploy
      - run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      - run: pnpm --filter @kaizen/api seed:demo
        env:
          DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      # L1 runs in the serial suite's config, which is how the per-PR run gets it too.
      - name: L1, full size
        run: pnpm --filter @kaizen/api exec vitest run src/tests/ledger/ledgerProperty.test.ts
      # L3 and the rest of the concurrency suite, through the concurrency config.
      - name: Concurrency suite, L3 at full size
        run: pnpm --filter @kaizen/api test:concurrency

# There was no CI of any kind in this repository. The 382-test suite existed and
# ran only where somebody remembered to run it, which meant a change could merge
# green with the suite broken and nobody would know until the next person tried.
#
# Everything here is a gate that has already caught something, or is the cheapest
# possible guard against a class of failure the project has already had:
# a stale MAP (every session re-discovers the repo) and an unknown Tailwind
# token (two dead classes shipped for two releases). Schema changes go through a
# migration; `db:drift` fails the build when the migration history and the schema
# disagree, because `db push` used to hide that disagreement.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # So `BuildFootnote` stops rendering `known: false` and a deployed bundle can
  # say which build it is. See apps/api/src/platform/build.ts.
  BUILD_SEQUENCE: ${{ github.run_number }}
  GIT_SHA: ${{ github.sha }}

jobs:
  static:
    name: typecheck · lint · map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kaizen/shared build
      - run: pnpm --filter @kaizen/semantic build
      - run: pnpm --filter @kaizen/api exec prisma generate
      - run: pnpm --filter @kaizen/api db:validate
      - run: pnpm typecheck
      - run: pnpm lint
      # Refuses mock calls in the API suite, unregistered or forced governed
      # writes, and new money or UTC-period sites; the baselines only shrink.
      - run: pnpm gates
      # The scans have their own tests, so a scan that stops catching what it
      # claims fails here instead of passing silently.
      - run: pnpm gates:test
      # Formatting is enforced from Wave 1 on. The one reformat commit is in
      # .git-blame-ignore-revs so blame still points at real changes.
      - run: pnpm format:check
      # The map is the index every session reads instead of searching. A stale
      # one is worse than none, because it is believed.
      - run: pnpm map:check
      # The gate's own tests (G6). They need git and nothing else, so they run
      # here rather than in the database job below.
      - run: pnpm gates:fail-first:test

  # The web suite (vitest + jsdom, with the axe checks in a11y.test.tsx) needs no
  # database and no Prisma client. It was only ever run by hand, so an axe
  # violation could merge green.
  web-tests:
    name: web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kaizen/shared build
      - run: pnpm test:web

  test:
    name: api tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaizen
          POSTGRES_PASSWORD: kaizen
          POSTGRES_DB: kaizen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # The API and the suite connect as the application role, which row-level
      # security binds (FX-51). Migrations and the seed run as the owner.
      DATABASE_URL: postgresql://kaizen_app:kaizen_app@127.0.0.1:5432/kaizen_test?schema=public
      MIGRATION_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      UNSCOPED_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      TEST_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      # The drift check replays the migrations into this scratch database, then
      # diffs the result against the schema. Created below in the same server.
      SHADOW_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_shadow?schema=public
      NODE_ENV: test
      # Supplied, never defaulted: the API has no fallback secret any more, and
      # refuses to boot without the field key in any environment (G5).
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      # The seed encrypts PAN and bank values with this key and the suite reads
      # them back, so every step here, vitest.config.ts and scripts/test-db.sh
      # must agree on the value.
      FIELD_ENCRYPTION_KEY: test-only-field-encryption-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kaizen/shared build
      - run: pnpm --filter @kaizen/semantic build
      - name: Create the shadow database for the drift check
        env:
          PGPASSWORD: kaizen
        run: psql -h 127.0.0.1 -U kaizen -d kaizen_test -c "CREATE DATABASE kaizen_shadow"
      - run: pnpm --filter @kaizen/api db:drift
      # Before migrations: the migration creates the application role only if missing.
      - name: Create the application role
        env:
          PGPASSWORD: kaizen
        run: psql -h 127.0.0.1 -U kaizen -d kaizen_test -v ON_ERROR_STOP=1 -f scripts/app-role.sql
      - run: pnpm --filter @kaizen/api db:deploy
      - run: pnpm --filter @kaizen/api exec prisma generate
      # The suite looks up the seeded `kaizen` tenant and the demo staff
      # (tests/helpers.ts principalFor, fixtures/run.ts); without both, every
      # principal lookup throws and the suite fails before it asserts anything.
      # The seed writes every tenant's rows, so it runs as the owner.
      - run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      - run: pnpm --filter @kaizen/api seed:demo
        env:
          DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      - run: pnpm --filter @kaizen/api test
      # The concurrency suite (CI-GATES-DRAFT section 2) has its own config, so its races never run in
      # the serial suite above. Same env as the job. The per-PR size is L3_CONCURRENCY's default (50);
      # the 200-request run is proof-full.yml, at phase end.
      - run: pnpm --filter @kaizen/api test:concurrency

  # Failing-test-first (G6). A red commit's named tests run against its parent,
  # where they must fail, and at the head, where they must pass, so this job needs
  # the same database as the api tests. The head is checked out by SHA: the
  # default checkout of a pull request is a merge commit, which would make the
  # base look like part of the PR's own history.
  fail-first:
    name: failing-test-first
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaizen
          POSTGRES_PASSWORD: kaizen
          POSTGRES_DB: kaizen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # Same split as the test job (FX-51).
      DATABASE_URL: postgresql://kaizen_app:kaizen_app@127.0.0.1:5432/kaizen_test?schema=public
      MIGRATION_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      UNSCOPED_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      TEST_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      # The replayed red tests boot the API and read seeded PAN and bank values,
      # so this job needs the test job's key: without it the API refuses to boot
      # (G5) and every replay fails for the wrong reason.
      FIELD_ENCRYPTION_KEY: test-only-field-encryption-key-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
        with:
          # Every branch is fetched, so origin/<base> exists for the merge-base.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kaizen/shared build
      - run: pnpm --filter @kaizen/semantic build
      - name: Create the application role
        env:
          PGPASSWORD: kaizen
        run: psql -h 127.0.0.1 -U kaizen -d kaizen_test -v ON_ERROR_STOP=1 -f scripts/app-role.sql
      - run: pnpm --filter @kaizen/api db:deploy
      - run: pnpm --filter @kaizen/api exec prisma generate
      - run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      - run: pnpm --filter @kaizen/api seed:demo
        env:
          DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen_test?schema=public
      # Title, labels and base ref are untrusted text. They reach the script
      # through the environment, never through the shell source.
      - name: Check the red tests
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: node scripts/ci/fail-first.mjs --base "origin/$BASE_REF" --title "$PR_TITLE" --labels "$PR_LABELS"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kaizen/shared build
      - run: pnpm --filter @kaizen/semantic build
      - run: pnpm --filter @kaizen/api exec prisma generate
      - name: build
        env:
          BUILT_AT: ${{ github.event.repository.updated_at }}
        run: pnpm build

  e2e:
    name: browser smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaizen
          POSTGRES_PASSWORD: kaizen
          POSTGRES_DB: kaizen
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # Same split as the api tests (FX-51): the app connects as the role RLS
      # binds; migrations, the seed and cross-tenant jobs use the owner.
      DATABASE_URL: postgresql://kaizen_app:kaizen_app@127.0.0.1:5432/kaizen?schema=public
      MIGRATION_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen?schema=public
      UNSCOPED_DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen?schema=public
      NODE_ENV: development
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      # The API boots only with this set; the seed and the server share it.
      FIELD_ENCRYPTION_KEY: test-only-field-encryption-key-not-used-anywhere-else-0123456789
      # The suite signs in as a real account; the seed reads these names, so the
      # password is known rather than generated and printed once.
      OWNER_EMAIL: chairman@kaizen.co.in
      OWNER_PASSWORD: ci-only-password-not-used-anywhere-else
      E2E_EMAIL: chairman@kaizen.co.in
      E2E_PASSWORD: ci-only-password-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kaizen/shared build
      - run: pnpm --filter @kaizen/semantic build
      - name: Create the application role
        env:
          PGPASSWORD: kaizen
        run: psql -h 127.0.0.1 -U kaizen -d kaizen -v ON_ERROR_STOP=1 -f scripts/app-role.sql
      - run: pnpm --filter @kaizen/api db:deploy
      - run: pnpm --filter @kaizen/api exec prisma generate
      - run: pnpm db:seed
        env:
          DATABASE_URL: postgresql://kaizen:kaizen@127.0.0.1:5432/kaizen?schema=public
      - run: pnpm --filter @kaizen/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # G12. Lighthouse scores the built client, served by the built API on one
      # origin, after Playwright has stopped its dev servers. A page below the
      # threshold fails the job; the threshold is not lowered to pass a page.
      - name: Build the client and the API for Lighthouse
        run: pnpm --filter @kaizen/web build && pnpm --filter @kaizen/api build
      - name: Serve the built app and run Lighthouse accessibility
        env:
          WEB_DIST_DIR: ${{ github.workspace }}/apps/web/dist
          E2E_BASE_URL: http://127.0.0.1:4000
          LH_REPORT_DIR: lighthouse-reports
        run: |
          node apps/api/dist/server.js > api-lighthouse.log 2>&1 &
          curl -sf --retry 60 --retry-connrefused --retry-delay 1 http://127.0.0.1:4000/health > /dev/null
          pnpm --filter @kaizen/e2e lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-reports
          path: |
            e2e/lighthouse-reports/
            api-lighthouse.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
